---
- name: Stop Wazuh Agent service
  ansible.builtin.systemd:
    name: wazuh-agent
    state: stopped
  failed_when: false # Prevents the playbook from stopping if the service doesn't exist

- name: Disable Wazuh Agent service
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: false
  failed_when: false

- name: Remove Wazuh Agent package
  ansible.builtin.apt:
    name: wazuh-agent
    state: absent
    update_cache: yes

- name: Purge Wazuh Agent configuration files
  ansible.builtin.apt:
    name: wazuh-agent
    state: absent
    purge: yes

- name: Force systemd daemon reload
  ansible.builtin.systemd:
    daemon_reload: yes